<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Porygon Trail // Ops Dex</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-i/red-blue/gray/137.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="crt-flicker"></div>

    <header class="dex-header">
        <div class="dex-lens"></div>
        <h1>OPS·DEX</h1>
        <span class="dex-sub">PORYGON TRAIL — INTERNAL TELEMETRY</span>
        <span id="last-refresh" class="dex-refresh">SYNCING…</span>
    </header>

    <main id="app">
        <div id="loading" class="loading-row">
            <span class="blink">█</span> ESTABLISHING UPLINK TO SUPABASE…
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="dashboard.js"></script>

</html>
