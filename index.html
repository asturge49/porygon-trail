<!DOCTYPE html>

    <title>Porygon Trail: Kanto Expedition</title>
    <!-- Favicon — same Gen I gray Porygon sprite used on the title screen -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-i/red-blue/gray/137.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=628e051">

    <!-- Vercel Web Analytics — vanilla-JS script-tag method (no npm package,
         no build step needed). Only resolves on an actual Vercel deployment;
         404s harmlessly in local dev / any non-Vercel host. -->
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-screen">
            <div id="app"></div>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Config (fill in your Supabase URL + anon key here) -->
    <script src="engine/config.js?v=628e051"></script>

    <!--
        Cache-busting: every local script below carries ?v=<short git hash of
        the commit that last touched this deploy>. No build step exists in
        this project (see CLAUDE.md), so this is applied by hand rather than
        injected automatically — bump every "?v=628e051" to the new commit's
        short hash whenever you cut a deploy with real gameplay changes.
        Without this, Vercel's edge cache and players' own browsers can go on
        serving a stale pre-deploy copy of these files for a while after a
        push, which is exactly what caused the post-merge HP-values-look-wrong
        confusion (Dodrio computing to 3 instead of 4, etc.) — the code was
        already fixed on the server, browsers just hadn't fetched it yet.
    -->

    <script src="engine/pixel-art.js?v=628e051"></script>

    <!-- Main: restore session then route to title or login -->
    <script>
        (function() {
            const PT = window.PorygonTrail;
            PT.App = PT.Engine.ScreenManager;
            PT.App.init(document.getElementById('app'));

            // Time-on-page tracking for internal reporting (see engine/telemetry.js's
            // top-of-file comment for the query). Starts regardless of login state —
            // logEvent() itself no-ops if Supabase isn't configured, so this is a
            // harmless call in local/dev environments.
            if (PT.Engine.Telemetry) PT.Engine.Telemetry.startSessionTracking();

            const auth = PT.Engine.Auth;
            if (auth && auth.isConfigured()) {
                auth.restoreSession().then(async loggedIn => {
                    if (loggedIn) {
                        await PT.Engine.Records.syncRecordsOnLogin().catch(() => {});
                        await PT.Engine.Scoring.syncPokedexOnLogin().catch(() => {});
                    }
                    PT.App.goto(loggedIn ? 'TITLE' : 'LOGIN');
                }).catch(() => {
                    PT.App.goto('LOGIN');
                });
            } else {
                // Supabase not configured — dev mode, skip auth
                PT.App.goto('TITLE');
            }
        })();
    </script>
</body>
